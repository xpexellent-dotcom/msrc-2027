name: Foundation checks

on:
  # Branch commits are checked through their pull request; a push run as well doubled every PR run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      auth_stability:
        description: 'Five fail-fast cold database passes and repeated staff keyboard checks'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  application:
    name: Lint, types, unit, build, browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install test browser
        run: |
          bash scripts/prepare-ci-browser-archive.sh
          pnpm exec playwright install --with-deps chromium
      - name: Verify local-only synthetic staff security lab
        if: ${{ !inputs.auth_stability }}
        run: pnpm exec playwright test --config playwright.auth.config.ts
      - name: Verify the enabled synthetic registration request interface
        if: ${{ !inputs.auth_stability }}
        run: pnpm exec playwright test --config playwright.registration.config.ts
      - name: Verify published content and safe fallback in both languages
        if: ${{ !inputs.auth_stability }}
        run: |
          node scripts/build-content-e2e.ts
          pnpm exec playwright test --config playwright.content.config.ts
      - name: Repeat staff hydration and session keyboard assertions without retries
        if: ${{ inputs.auth_stability }}
        shell: bash
        run: |
          for project in auth-desktop auth-tablet auth-mobile; do
            pnpm exec playwright test --config playwright.auth.config.ts --project="$project" --grep 'keyboard login waits|regular staff password and session email check' --repeat-each=5
          done
      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-results
          path: |
            playwright-report/
            test-results/
            playwright-auth-report/
            playwright-content-report/
            test-auth-results/
          if-no-files-found: ignore
          retention-days: 7

  public_browser:
    name: Public browser checks (shard ${{ matrix.shard }}/3)
    if: ${{ !inputs.auth_stability }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    # Keep all public checks while splitting their growing workload across runners.
    # Each shard retains the config's one worker, zero retries and existing limits.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install test browser
        run: |
          bash scripts/prepare-ci-browser-archive.sh
          pnpm exec playwright install --with-deps chromium
      - name: Verify public pages and interactions
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - name: Upload public browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-browser-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  contact:
    name: Contact enabled/closed synthetic browser checks (${{ matrix.project }})
    if: ${{ !inputs.auth_stability }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [contact-desktop, contact-mobile, contact-safari, contact-iphone, contact-ipad]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    # Keep this independent suite outside the public/staff browser job's budget.
    # The same tests and limits run against loopback mocks; no real mail or secrets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install test browser
        run: |
          bash scripts/prepare-ci-browser-archive.sh
          pnpm exec playwright install --with-deps chromium webkit
      - name: Verify Contact on and off with loopback mocks, never email
        run: pnpm exec playwright test --config playwright.contact.config.ts --project=${{ matrix.project }}
      - name: Upload synthetic Contact browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contact-delivery-browser-results-${{ matrix.project }}
          path: |
            playwright-contact-report/
            test-contact-results/
          if-no-files-found: ignore
          retention-days: 7

  real_user:
    name: Visitor interactions, Chromium and WebKit (shard ${{ matrix.shard }}/3)
    if: ${{ !inputs.auth_stability }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # WebKit's native media decoder does not inherit Playwright's trust for
      # the self-signed loopback certificate. Public video uses identical HTTP
      # content; navigation/private CSP checks still run over real local TLS.
      REAL_USER_MEDIA_BASE_URL: "http://127.0.0.1:3210"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install both browser engines
        run: |
          bash scripts/prepare-ci-browser-archive.sh
          pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise visitor state changes and all bilingual sitemap pages
        run: pnpm exec playwright test --config playwright.real-user.config.ts --shard=${{ matrix.shard }}/3
      - name: Upload visitor evidence, including failure screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-user-browser-results-${{ matrix.shard }}
          path: |
            playwright-report/real-user/
            test-results/real-user/
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: Local migration and RLS checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install locked dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      - name: Bind the synthetic local stack to loopback
        run: docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 msrc2027-local
      - name: Configure no-delivery managed Auth tests on the disposable runner only
        run: node scripts/prepare-ci-managed-auth.ts
      - name: Start local stack without exposing generated credentials
        shell: bash
        run: |
          umask 077
          startup_log="$(mktemp "${RUNNER_TEMP}/msrc-local-start.XXXXXX")"
          trap 'rm -f -- "$startup_log"' EXIT
          if pnpm db:start >"$startup_log" 2>&1; then
            printf '%s\n' 'Local Supabase started; credential-bearing output withheld.'
          else
            printf '%s\n' 'Local Supabase startup failed. Reproduce locally and inspect output privately.'
            exit 1
          fi
      - name: Record the actual isolated GoTrue image without environment or credentials
        run: docker inspect --format='{{.Config.Image}}' supabase_auth_msrc2027-local
      - run: pnpm db:reset
      - run: pnpm db:lint
      - name: Lint private registration functions
        run: pnpm exec supabase db lint --local --schema msrc_registration --level warning --fail-on warning
      - name: Lint the private closed outbox schema
        run: pnpm exec supabase db lint --local --schema msrc_outbox --level warning --fail-on warning
      - name: Install the private disposable Storage test helper
        id: storage_fixture
        run: node scripts/ci-storage-fixture.ts --install
      - run: pnpm db:test
      - name: Remove the private Storage helper before advisors and native tests
        if: ${{ always() && (steps.storage_fixture.outcome == 'success' || steps.storage_fixture.outcome == 'failure') }}
        run: node scripts/ci-storage-fixture.ts --cleanup
      - name: Inspect local database security findings
        run: pnpm exec supabase db advisors --local --type security --level warn --fail-on error
      - name: Inspect local database performance findings
        run: pnpm exec supabase db advisors --local --type performance --level warn --fail-on error
      - name: Generate the public synthetic schema types for review
        shell: bash
        run: |
          types_file="$(mktemp "${RUNNER_TEMP}/msrc-types.XXXXXX.ts")"
          trap 'rm -f -- "$types_file"' EXIT
          pnpm --silent db:types >"$types_file"
          test -s "$types_file"
          pnpm exec tsc --noEmit --strict --skipLibCheck --target ES2020 "$types_file"
          cat "$types_file"
      - name: Prepare local public client settings without printing credentials
        run: pnpm db:env
      - name: Verify browser and server wrappers against the local Data API
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:integration
      - name: Repeat the concurrent integration suites from five cold fixture states
        if: ${{ inputs.auth_stability }}
        shell: bash
        run: |
          for pass in 1 2 3 4 5; do
            printf 'Cold fixture pass %s of 5\n' "$pass"
            pnpm db:reset
            pnpm db:integration
          done
      # Registration fixtures change private singleton policy and create their own
      # Super Admin pair; isolate them from the existing concurrency/native suites.
      - name: Reset the disposable database for registration proofs
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:reset
      - name: Verify registration races and persisted key rotation
        if: ${{ !inputs.auth_stability }}
        env:
          REGISTRATION_DB_TESTS: "true"
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/registration-concurrency.test.ts
      - name: Reset the disposable database for staff queue allocation proofs
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:reset
      - name: Verify last-seat contention and waiting staff-session expiry
        if: ${{ !inputs.auth_stability }}
        env:
          STAFF_REGISTRATION_DB_TESTS: "true"
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/staff-registration-concurrency.test.ts
      - name: Reset the disposable database for media operation proofs
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:reset
      - name: Verify media version races and durable Storage operation exclusion
        if: ${{ !inputs.auth_stability }}
        env:
          STAFF_MEDIA_DB_TESTS: "true"
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/staff-media-concurrency.test.ts
      - name: Reset the disposable database for content publication proofs
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:reset
      - name: Verify content version races and waiting-session authorization
        if: ${{ !inputs.auth_stability }}
        env:
          STAFF_CONTENT_DB_TESTS: "true"
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/staff-content-concurrency.test.ts
      - name: Reset the disposable database for abstract and review proofs
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:reset
      - name: Verify PI limits, immutable versions and review allocation races
        if: ${{ !inputs.auth_stability }}
        env:
          ABSTRACT_DB_TESTS: "true"
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/abstract-concurrency.test.ts
      - name: Reset the disposable database for competition proofs
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:reset
      - name: Verify competition draft, idempotency and finalist publication races
        if: ${{ !inputs.auth_stability }}
        env:
          COMPETITIONS_DB_TESTS: "true"
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/competition-concurrency.test.ts
      - name: Reset the disposable database for advisory scoring proofs
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:reset
      - name: Verify advisory budget contention, job deduplication and lease fencing
        if: ${{ !inputs.auth_stability }}
        env:
          ADVISORY_DB_TESTS: "true"
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/advisory-concurrency.test.ts

      - name: Reset the disposable database for announcement proofs
        if: ${{ !inputs.auth_stability }}
        run: pnpm db:reset
      - name: Verify announcement double sends, audience changes and waiting-session authorization
        if: ${{ !inputs.auth_stability }}
        env:
          ANNOUNCEMENT_DB_TESTS: "true"
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/announcement-concurrency.test.ts
      - name: Stop the local stack
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: pnpm db:stop

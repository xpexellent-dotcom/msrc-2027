name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production:
    name: Verify Vercel aliases and Supabase reachability
    if: ${{ github.repository == 'xpexellent-dotcom/msrc-2027' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify the production deployment for this commit
        run: node scripts/verify-production.ts
        env:
          GH_TOKEN: ${{ github.token }}
